name: Build all components

# Convenience workflow: builds every component x every versions.yaml
# build_matrix combination. Useful for a full sanity sweep without cutting a
# release (see release.yml for the tag-triggered release build).

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU arch to build (all = every arch each component opts into)"
        type: choice
        default: all
        # Choices must be static, so this mirrors versions.yaml's build_matrix
        # arches by hand; generate_matrix.py rejects any that aren't in it.
        options: [all, x86_64, aarch64]
  schedule:
    # Weekly sanity build, Monday 03:00 UTC.
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compute-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_builds: ${{ steps.matrix.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: matrix
        env:
          # Only workflow_dispatch carries an arch choice; the scheduled sweep
          # always covers every arch.
          ARCH: ${{ inputs.arch || 'all' }}
        run: python3 ci/generate_matrix.py --component all --arch "$ARCH" --github-output

  build:
    needs: compute-matrix
    # An arch filter can leave nothing to build (e.g. no component opts into
    # the chosen arch); an empty matrix is a workflow error, so skip instead.
    if: needs.compute-matrix.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      component: ${{ matrix.component }}
      path: ${{ matrix.path }}
      ref: ${{ matrix.ref }}
      builder: ${{ matrix.builder }}
      runs-on: ${{ matrix.runs_on }}
      arch: ${{ matrix.arch }}
      cuda-version: ${{ matrix.cuda }}
      python-version: ${{ matrix.python }}
      torch-version: ${{ matrix.torch }}
      torch-vision-version: ${{ matrix.torch_vision }}
      torch-audio-version: ${{ matrix.torch_audio }}
      cxx11-abi: ${{ matrix.cxx11_abi }}
      torch-cuda-arch-list: ${{ matrix.torch_cuda_arch_list }}
      verify-wheel-archs: ${{ matrix.verify_wheel_archs }}
      requires-cudnn: ${{ matrix.requires_cudnn }}
      max-jobs: ${{ matrix.max_jobs }}
      extra-env: ${{ matrix.extra_env }}
      build-timeout: ${{ matrix.build_timeout }}
      job-timeout-minutes: ${{ matrix.job_timeout_minutes }}
    secrets:
      BYTED_PROXY: ${{ secrets.BYTED_PROXY }}
