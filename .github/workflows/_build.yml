name: "\u007eBuild wheel"

# Reusable single-combination build workflow, structured after
# flash-attention's own .github/workflows/_build.yml. Every field a build
# needs (component identity, checkout ref, CPU arch, CUDA/Python/Torch
# versions, GPU arch list, job parallelism, extra env) is passed in as an
# input rather than hard-coded, so the whole build matrix is driven purely
# by the project's versions.yaml (in the repo's base directory).

on:
  workflow_call:
    inputs:
      component:
        description: "Component name from versions.yaml (e.g. apex)"
        required: true
        type: string
      path:
        description: "Submodule path relative to the repo root"
        required: true
        type: string
      ref:
        description: "Git ref (branch/tag/commit) to check out within the submodule"
        required: true
        type: string
      builder:
        description: "Name of ci/build_scripts/<builder>.sh to run"
        required: true
        type: string
      runs-on:
        description: "JSON-encoded GitHub Actions runner label or required-label list"
        required: false
        type: string
        default: '"ubuntu-24.04"'
      arch:
        description: >-
          CPU architecture this combination builds for, as `uname -m` spells
          it (x86_64 / aarch64). Only identifies the build - the runner it
          lands on comes from `runs-on` - so the job asserts the two agree
          before compiling anything, and it namespaces the wheel artifact and
          the resumable build cache so two arches never collide or resume
          from each other's object files.
        required: false
        type: string
        default: "x86_64"
      cuda-version:
        required: true
        type: string
      python-version:
        required: true
        type: string
      torch-version:
        required: true
        type: string
      torch-vision-version:
        required: true
        type: string
      torch-audio-version:
        required: true
        type: string
      cxx11-abi:
        required: true
        type: string
      torch-cuda-arch-list:
        required: false
        type: string
        default: ""
      requires-cudnn:
        required: false
        type: string
        default: "false"
      max-jobs:
        required: false
        type: string
        default: "1"
      extra-env:
        description: "JSON object string of extra environment variables to export"
        required: false
        type: string
        default: "{}"
      build-timeout:
        description: "Wall-clock budget for the build step (e.g. 5h, 10h); keep below job_timeout_minutes so cache-save steps can run"
        required: false
        type: string
        default: "5h"
      job-timeout-minutes:
        description: "GitHub Actions job timeout for the whole build job"
        required: false
        type: number
        default: 360
      upload-to-release:
        required: false
        type: boolean
        default: false
      release-version:
        description: "Release tag to upload wheels to, when upload-to-release is true"
        required: false
        type: string
        default: ""
    secrets:
      BYTED_PROXY:
        description: >-
          Optional HTTP(S) egress proxy URL for self-hosted runners (e.g.
          apex/transformer-engine). When set, GitHub-bound transfers on
          self-hosted runners - workflow artifact upload, release asset upload,
          and the Actions resumable build cache - are routed through it, since
          those runners' direct egress to GitHub is slow and prone to hanging.
          Only forwarded by the apex/transformer-engine workflows (and the
          build-all/release sweeps that also build them). The steps below gate
          on runner.environment == 'self-hosted', so it is always a no-op on
          GitHub-hosted runners even if forwarded.
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  build:
    name: "${{ inputs.component }} (${{ inputs.arch }}-cuda${{ inputs.cuda-version }}-py${{ inputs.python-version }}-torch${{ inputs.torch-version }})"
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      # Repository secrets do not follow a repo when it is transferred or
      # re-created under a new owner, and an unset BYTED_PROXY is otherwise
      # invisible: the proxy env below just resolves to "", the build succeeds,
      # and the first GitHub-bound transfer then hangs until the job timeout.
      - name: Check egress proxy configuration
        if: runner.environment == 'self-hosted'
        env:
          BYTED_PROXY: ${{ secrets.BYTED_PROXY }}
        run: |
          set +x  # never trace-expand the proxy URL, even though Actions masks it
          if [ -z "${BYTED_PROXY:-}" ]; then
            echo "::warning::BYTED_PROXY is unset, so GitHub-bound transfers from this self-hosted runner (wheel artifact, release assets, build cache) will use a direct connection. That egress is slow and prone to hanging; the steps below will time out rather than stall. Set BYTED_PROXY as a repository secret to an HTTP(S) egress proxy URL."
          fi

      # A mismatch here means versions.yaml pairs an arch with a runner that
      # isn't that arch (e.g. an aarch64 row whose arch_overrides still point
      # at ubuntu-24.04). Everything downstream would still "work" - it would
      # just quietly publish a wheel whose platform tag contradicts the
      # release's own title - so fail before spending hours compiling.
      - name: Verify runner architecture is ${{ inputs.arch }}
        run: |
          actual="$(uname -m)"
          if [ "$actual" != "${{ inputs.arch }}" ]; then
            echo "::error::This build targets ${{ inputs.arch }} but the runner is $actual. Fix the component's runs_on/arch_overrides in versions.yaml." >&2
            exit 1
          fi

      - name: Checkout verl-wheelhouse
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Checkout ${{ inputs.component }} @ ${{ inputs.ref }}
        run: |
          # inputs.path is the build working directory, which is usually a
          # submodule root (e.g. "apex") but is allowed to be a subdirectory
          # within one, for projects whose buildable extension lives in a
          # subdir that isn't a submodule in its own right. `git submodule
          # update -- <pathspec>` only recognizes paths registered in
          # .gitmodules, so walk up from inputs.path to find the nearest
          # registered submodule root.
          submodule_path="${{ inputs.path }}"
          while ! git config -f .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}' | grep -qx "$submodule_path"; do
            if [ "$submodule_path" = "." ]; then
              echo "::error::No submodule in .gitmodules matches or contains path '${{ inputs.path }}'" >&2
              exit 1
            fi
            submodule_path="$(dirname "$submodule_path")"
          done

          # Shallow-init the submodule (fast - uses whatever commit is
          # currently pinned just to get a working .git + origin remote),
          # then fetch and check out the ref versions.yaml actually pins.
          # This decouples version bumps from the submodule pointer commit.
          #
          # --force throughout: self-hosted runners (see runs_on in
          # versions.yaml, e.g. apex/transformer-engine) reuse their workspace
          # across runs, and a build can leave tracked files *inside* the
          # submodule modified - generated sources, in-tree build artifacts, or
          # a build script rewriting the project's own requirement pins.
          # The checkout above runs with submodules:false, so it only cleans
          # the superproject and never descends into the submodule's working
          # tree; a previous build's edits therefore survive on disk and make
          # an unforced checkout abort with "Your local changes to the
          # following files would be overwritten by checkout". Forcing the
          # checkout discards that leftover state so every build starts clean.
          git submodule update --init --force --depth 1 -- "$submodule_path"
          cd "$submodule_path"

          # Fetch the ref versions.yaml pins, retrying on a transient git bug.
          # git 2.54.x (currently shipped on ubuntu-24.04 runners) has a
          # regression where a "git fetch --depth" onto a just-created shallow
          # clone intermittently aborts with "fatal: shallow file has changed
          # since we read it" - a spurious race in its shallow-file safety check
          # (fixed upstream in git 2.55). It is transient, so a fresh retry of
          # the identical fetch succeeds. Any leftover shallow.lock is removed by
          # git's own on-exit lockfile cleanup, so retries start clean.
          # See https://github.com/python/cpython/issues/151365
          for attempt in 1 2 3 4 5; do
            if git fetch --depth 1 origin "${{ inputs.ref }}"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::git fetch of '${{ inputs.ref }}' failed after 5 attempts" >&2
              exit 1
            fi
            echo "::warning::git fetch attempt ${attempt}/5 failed (transient 'shallow file has changed'?); retrying in 3s..." >&2
            sleep 3
          done

          git checkout --detach --force FETCH_HEAD
          git submodule update --init --recursive --force --depth 1

      # Both steps below only make sense on GitHub's throwaway VMs: the cleanup
      # deletes preinstalled toolchains that belong to the host on a persistent
      # self-hosted machine, and the swap file is there to survive nvcc's peak
      # RSS on a 16 GB runner (the self-hosted machine has memory to spare and
      # would just accumulate swap files across runs).
      - name: Free up disk space
        if: runner.environment != 'self-hosted'
        run: |
          source ci/build_scripts/common.sh
          free_disk_space

      - name: Set up swap space
        if: runner.environment != 'self-hosted'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install CUDA ${{ inputs.cuda-version }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ inputs.cuda-version }}
          method: network
          linux-local-args: '["--toolkit"]'
          # nvcc/cudart/nvrtc/nvtx/profiler-api are genuine "cuda-<name>-X-Y" apt
          # packages, so sub-packages (which prepends "cuda-") works for them.
          # nvrtc-dev is separate from nvrtc: the runtime package only ships
          # libnvrtc.so, while nvrtc.h lives in cuda-nvrtc-dev (under
          # targets/x86_64-linux/include). nvml-dev likewise ships nvml.h for
          # TransformerEngine's util/cuda_nvml.cpp. nvtx ships the header-only NVTX v3
          # API (nvtx3/nvToolsExt.h) that TransformerEngine includes from
          # common/nvtx.h. profiler-api ships cuda_profiler_api.h, which apex
          # and TransformerEngine megatron softmax kernels include (even though
          # they don't call the profiler API). cublas, cusolver, cusparse,
          # curand and cufft are NOT: NVIDIA has only ever published these as
          # "lib<name>-X-Y" / "lib<name>-dev-X-Y" - there is no "cuda-cublas-X-Y"
          # etc. on any CUDA version - so they must go through
          # non-cuda-sub-packages (no prefix added) instead, with both the
          # runtime and -dev (headers) package requested.
          # cccl ships cuda/atomic, cuda/std/*, thrust, cub headers. CUDA 13
          # moved them under include/cccl/; host C++ builds need the cccl
          # include root on the search path (see ensure_cuda_cccl_include_path).
          # driver-dev is the only home of the libcuda.so *stub* on CUDA 13
          # (targets/<t>/lib/stubs/) - neither cudart nor cudart-dev carries it.
          # A build machine has no NVIDIA driver, so any component that links
          # the driver API (deep-ep's hybrid_ep extension) links that stub; see
          # ensure_cuda_stub_library_path for the matching link-path setup.
          sub-packages: '["nvcc", "cudart", "nvrtc", "nvrtc-dev", "nvml-dev", "nvtx", "profiler-api", "cccl", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev", "libcusolver", "libcusolver-dev", "libcusparse", "libcusparse-dev", "libcurand", "libcurand-dev", "libcufft", "libcufft-dev"]'

      - name: Install cuDNN
        if: inputs.requires-cudnn == 'true'
        env:
          CUDA_VERSION: ${{ inputs.cuda-version }}
        run: |
          source ci/build_scripts/common.sh
          install_cudnn

      - name: Install PyTorch ${{ inputs.torch-version }}+cu${{ inputs.cuda-version }}
        run: |
          pip install --upgrade pip
          TORCH_CUDA_TAG="cu$(echo '${{ inputs.cuda-version }}' | cut -d. -f1,2 | tr -d '.')"
          pip install \
            "torch==${{ inputs.torch-version }}" \
            "torchvision==${{ inputs.torch-vision-version }}" \
            "torchaudio==${{ inputs.torch-audio-version }}" \
            --index-url "https://download.pytorch.org/whl/${TORCH_CUDA_TAG}"
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: Restore resumable build cache
        uses: actions/cache/restore@v4
        timeout-minutes: 30
        env:
          # Self-hosted runners (apex/transformer-engine) reach GitHub via
          # BYTED_PROXY; empty = direct connection on GitHub-hosted runners.
          HTTP_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
          HTTPS_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
        with:
          path: ${{ inputs.path }}/build-cache.tar
          key: never-match-${{ github.run_id }}
          restore-keys: |
            build-cache-${{ inputs.component }}-${{ inputs.arch }}-${{ inputs.cuda-version }}-${{ inputs.python-version }}-${{ inputs.torch-version }}-

      - name: Unpack resumable build cache
        working-directory: ${{ inputs.path }}
        run: |
          if [ -f build-cache.tar ]; then
            echo "Resuming from a previous (timed-out) build attempt"
            tar -xpf build-cache.tar
            rm -f build-cache.tar
          fi

      - name: Remove stale wheel output from previous runs
        working-directory: ${{ inputs.path }}
        run: |
          # Self-hosted runners (e.g. apex, transformer-engine) reuse their
          # workspace across runs, and the build scripts emit into dist/ without
          # clearing it first. Without this, a previous - possibly
          # different-version - build's wheel lingers in dist/ and gets swept
          # into the "Upload wheel(s) to release" step below (which globs
          # dist/*.whl), e.g. a stale transformer_engine-2.15 wheel leaking
          # into the transformer-engine-v2.16.1 release. dist/ holds only final
          # build output, so removing it never affects the resumable build
          # cache (that lives in build/).
          rm -rf dist

      - name: Build wheel
        id: build_wheel
        working-directory: ${{ inputs.path }}
        env:
          COMPONENT: ${{ inputs.component }}
          REF: ${{ inputs.ref }}
          TARGET_ARCH: ${{ inputs.arch }}
          CUDA_VERSION: ${{ inputs.cuda-version }}
          PYTHON_VERSION: ${{ inputs.python-version }}
          TORCH_VERSION: ${{ inputs.torch-version }}
          TORCH_VISION_VERSION: ${{ inputs.torch-vision-version }}
          TORCH_AUDIO_VERSION: ${{ inputs.torch-audio-version }}
          CXX11_ABI: ${{ inputs.cxx11-abi }}
          TORCH_CUDA_ARCH_LIST: ${{ inputs.torch-cuda-arch-list }}
          MAX_JOBS: ${{ inputs.max-jobs }}
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set +e
          # Stop safely with time to spare so the "save build cache" step below
          # can still run and a re-run of this workflow can resume instead of
          # starting cold.
          timeout ${{ inputs.build-timeout }} bash "${GITHUB_WORKSPACE}/ci/build_scripts/${{ inputs.builder }}.sh"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Save resumable build cache (on interrupt)
        if: always() && contains(fromJSON('["124", "137", "143"]'), steps.build_wheel.outputs.exit_code)
        working-directory: ${{ inputs.path }}
        run: tar -cpf build-cache.tar --exclude=build-cache.tar .

      - name: Upload resumable build cache (on interrupt)
        if: always() && contains(fromJSON('["124", "137", "143"]'), steps.build_wheel.outputs.exit_code)
        uses: actions/cache/save@v4
        timeout-minutes: 60
        env:
          # Self-hosted runners (apex/transformer-engine) reach GitHub via
          # BYTED_PROXY; empty = direct connection on GitHub-hosted runners.
          HTTP_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
          HTTPS_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
        with:
          path: ${{ inputs.path }}/build-cache.tar
          key: build-cache-${{ inputs.component }}-${{ inputs.arch }}-${{ inputs.cuda-version }}-${{ inputs.python-version }}-${{ inputs.torch-version }}-${{ github.run_id }}

      - name: Fail if build did not finish in time
        if: steps.build_wheel.outputs.exit_code == '124'
        run: |
          echo "::error::${{ inputs.component }} did not finish within the ${{ inputs.build-timeout }} budget. A resumable build cache was saved - re-run this workflow to continue from where it left off."
          exit 1

      - name: Fail if build was killed (OOM or runner interrupt)
        if: steps.build_wheel.outputs.exit_code == '137' || steps.build_wheel.outputs.exit_code == '143'
        run: |
          echo "::error::${{ inputs.component }} was killed (exit ${{ steps.build_wheel.outputs.exit_code }}; 137=SIGKILL/OOM, 143=SIGTERM). A resumable build cache was saved - re-run this workflow to continue from where it left off."
          exit 1

      - name: Fail on build error
        if: steps.build_wheel.outputs.exit_code != '0' && !contains(fromJSON('["124", "137", "143"]'), steps.build_wheel.outputs.exit_code)
        run: exit ${{ steps.build_wheel.outputs.exit_code }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        env:
          # Self-hosted runners (apex/transformer-engine) reach GitHub (and its
          # Azure blob artifact backend) via BYTED_PROXY; empty = direct
          # connection on GitHub-hosted runners.
          HTTP_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
          HTTPS_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
        with:
          name: wheel-${{ inputs.component }}-${{ inputs.arch }}-cu${{ inputs.cuda-version }}-py${{ inputs.python-version }}-torch${{ inputs.torch-version }}
          path: ${{ inputs.path }}/dist/*.whl
          if-no-files-found: error

      - name: Ensure release ${{ inputs.release-version }}
        if: inputs.upload-to-release
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Self-hosted runners (apex/transformer-engine) reach GitHub via
          # BYTED_PROXY; empty = direct connection on GitHub-hosted runners.
          HTTP_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
          HTTPS_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
        run: |
          pip install pyyaml
          python3 ci/release_meta.py --component "${{ inputs.component }}" > release-meta.json
          TAG=$(python3 -c "import json; print(json.load(open('release-meta.json'))[0]['tag'])")
          TITLE=$(python3 -c "import json; print(json.load(open('release-meta.json'))[0]['title'])")
          NOTES=$(python3 -c "import json; print(json.load(open('release-meta.json'))[0]['notes'])")
          if [ "$TAG" != "${{ inputs.release-version }}" ]; then
            echo "::error::release_meta tag ($TAG) does not match release-version (${{ inputs.release-version }})" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TITLE"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Upload wheel(s) to release ${{ inputs.release-version }}
        if: inputs.upload-to-release
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Self-hosted runners (apex/transformer-engine) reach GitHub via
          # BYTED_PROXY; empty = direct connection on GitHub-hosted runners.
          HTTP_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
          HTTPS_PROXY: ${{ runner.environment == 'self-hosted' && secrets.BYTED_PROXY || '' }}
        run: |
          gh release upload "${{ inputs.release-version }}" ${{ inputs.path }}/dist/*.whl \
            --repo "${{ github.repository }}" --clobber
